# TurboQuant-X — Model Config: LLaMA-2-70B-Chat (Q4_K_S, 37 GB)
# Usage:  TURBOQUANT_CONFIG=config/models/llama-2-70b.yaml python -m src.main
#         Or copy these values into config/default.yaml
#
# Hardware notes (RTX 4060 Ti 8 GB, 32 GB RAM, 28-core CPU):
#   - Auto-detect puts 12/80 layers on GPU (15%)
#   - 37 GB model > 29 GB free RAM → SSD paging → ~0.15 tok/s
#   - For better speed: download Q2_K (~19 GB) which fits fully in RAM (~1-3 tok/s)

model:
  name: "llama-2-70b-chat"
  path: "./models/llama-2-70b-chat.Q4_K_S.gguf"
  n_ctx: 2048           # Reduced from 4096 to free ~655 MB → 1-2 extra GPU layers
  n_gpu_layers: -1      # auto: ~14-15 layers on RTX 4060 Ti 8 GB (was 12 with old calc)
  gpu_safety_margin: 0.94  # Aggressive: use 94% of VRAM → ~14 GPU layers
                            # Set to 0.88 if you get OOM errors
  chat_format: "llama-2"
  n_threads: 20         # All 20 physical cores (i7-14700KF: 8 P-core + 12 E-core)
                        # -1 auto would give 14 (28//2), missing 6 physical cores
  n_threads_batch: 28   # All 28 logical threads for prompt eval (HT helps batch)
  n_batch: 1024         # Larger batch for faster prompt phase on CPU

# Recommended mode for LLaMA-2-70B on this hardware:
#   zero-quant — Q4_0 KV + n_threads_batch=28 → faster prompt, no Python overhead
#   turboquant — Q8_0 KV + PolarQuant compression → longer context, more quality
inference_mode: "zero-quant"

kv_cache:
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  flash_attention: true

turboquant:
  preset: "quality"
  block_size: 128

# Zero-Quant depth-adaptive config for LLaMA-2-70B (80 layers)
# Zone boundaries: shallow 0-19, middle 20-59, deep 60-79
# Avg KV bits ≈ 5.5K / 5.0V — about 40% smaller than Q8_0 KV at same context
zero_quant:
  shallow_fraction: 0.25
  deep_fraction: 0.25
  shallow_k_bits: 8
  shallow_v_bits: 8
  middle_k_bits: 4
  middle_v_bits: 2
  deep_k_bits: 8
  deep_v_bits: 8
  block_size: 128
  use_kv_coquant: false

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
