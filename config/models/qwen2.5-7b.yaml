# TurboQuant-X — Model Config: Qwen2.5-7B-Instruct (Q4_K_M, 4.4 GB)
# Usage:  TURBOQUANT_CONFIG=config/models/qwen2.5-7b.yaml python -m src.main
#         Or copy these values into config/default.yaml
#
# Hardware notes (RTX 4060 Ti 8 GB, 32 GB RAM):
#   - 4.4 GB model fits entirely in VRAM → all 28 layers on GPU
#   - Fastest model on this rig: ~30-50 tok/s

model:
  name: "qwen2.5-7b-instruct"
  path: "./models/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
  n_ctx: 8192           # Full context: 7B model has low KV cache overhead
  n_gpu_layers: -1      # auto: all 28 layers fit on GPU (4.4 GB < 7 GB budget)
  chat_format: "chatml"
  n_threads: -1         # auto: cpu_count // 2 (CPU rarely needed — all on GPU)
  n_threads_batch: -1   # auto: all cores
  n_batch: 512

# All layers on GPU → standard mode is already fast; turboquant adds longer context
# Benchmark (RTX 4060 Ti, 4096 ctx, seq=64):
#   standard:    54.7 tok/s, 8.0 avg bits, MSE=0.000000
#   turboquant:  55.4 tok/s, 6.0 avg bits, MSE=0.009966  CosSim=0.9953  Top-1=98.5%
#   zero-quant:  55.5 tok/s, 5.8 avg bits, MSE=0.023459  CosSim=0.9894  Top-1=93.6%
inference_mode: "turboquant"

kv_cache:
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  flash_attention: true

# Best TurboQuant preset (benchmark-proven): quality K8/V4
# CosSim=0.9953, Top-1 match=98.5%%, compress 7.76x, compress=14ms
turboquant:
  preset: "quality"     # K8/V4 — best CosSim+Top-1 balance
  block_size: 128

# Zero-Quant preset (switch inference_mode to "zero-quant" to activate)
# Best balance: sh8/mi4-3/dp8 — avg 5.75 bits, CosSim=0.9894, Top-1=93.6%%
# Middle K4 reduces Top-1 vs TurboQuant; mid V3 recovers quality vs V2
zero_quant:
  shallow_fraction: 0.25    # layers 0-6 protect with K8/V8
  deep_fraction: 0.25       # layers 21-27 protect with K8/V8
  shallow_k_bits: 8
  shallow_v_bits: 8
  middle_k_bits: 4          # sparse middle layers (7-20): K4 saves bandwidth
  middle_v_bits: 3          # raised 2->3: +2.1pp CosSim at +0.25 bits cost
  deep_k_bits: 8
  deep_v_bits: 8
  block_size: 128
  use_kv_coquant: false     # joint K-V codebook (paper [3]); false = independent

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
