# TurboQuant-X — Model Config: Qwen3.5-35B-A3B
# Usage:  TURBOQUANT_CONFIG=config/models/qwen3.5-35b.yaml python -m src.main
#         Or copy these values into config/default.yaml

model:
  name: "qwen3.5-35b-a3b"
  path: "./models/Qwen3.5-35B-A3B-q4_k_m.gguf"
  n_ctx: 4096
  n_gpu_layers: -1      # auto: ~12 layers on RTX 4060 Ti 8 GB
  chat_format: "chatml"
  n_threads: -1         # auto: cpu_count // 2 (= 14 on 28-core machine)
  n_threads_batch: -1   # auto: cpu_count (= 28) for fast prompt eval
  n_batch: 512

# Recommended inference settings for Qwen3.5-35B
# Use "zero-quant" for lower first-token latency on short conversations
# Benchmark preset guide (from Qwen-7B data — 35B architecture similar):
#   turboquant quality K8/V4: CosSim=0.9953, Top-1=98.5%%, compress 7.76x
#   zero-quant sh8/mi4-3/dp8: CosSim=0.9894, Top-1=93.6%%, avg 5.75 bits
inference_mode: "turboquant"

kv_cache:
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  flash_attention: true

# Best TurboQuant preset (benchmark-proven): quality K8/V4
# CosSim=0.9953, Top-1 match=98.5%% — best overall balance
turboquant:
  preset: "quality"     # K8/V4 — best CosSim+Top-1 balance
  block_size: 128

# Zero-Quant preset (switch inference_mode to "zero-quant" to activate)
# For 35B ~60+ layers: sh0.20/dp0.15 preserves more shallow/deep precision
zero_quant:
  shallow_fraction: 0.20    # first 20%% of layers — dense activations
  deep_fraction: 0.20       # last 20%% of layers — output-critical
  shallow_k_bits: 8
  shallow_v_bits: 8
  middle_k_bits: 4
  middle_v_bits: 3          # best V-bit from benchmarks (CosSim/memory balance)
  deep_k_bits: 8
  deep_v_bits: 8
  block_size: 128
  use_kv_coquant: false

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
