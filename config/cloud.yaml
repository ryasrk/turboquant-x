# Cloud LLM Provider Configuration
# API keys should go in .env (gitignored), not here.
# This file defines provider settings (models, base URLs, parameters).

default_provider: "zhipu"

providers:
  openai:
    # api_key loaded from .env: TURBOQUANT_CLOUD_OPENAI_API_KEY
    model: "gpt-4o"
    max_tokens: 16384
    temperature: 0.3
    top_p: 0.95
    timeout: 120
    # base_url: "https://api.openai.com/v1"  # default

  nvidia:  # NVIDIA NIM / Build API (reasoning model — needs high token budget)
    # api_key loaded from .env: TURBOQUANT_CLOUD_NVIDIA_API_KEY
    model: "openai/gpt-oss-120b"
    max_tokens: 32768
    temperature: 0.3
    top_p: 0.95
    timeout: 180
    # base_url: "https://integrate.api.nvidia.com/v1"  # default

  anthropic:
    # api_key loaded from .env: TURBOQUANT_CLOUD_ANTHROPIC_API_KEY
    model: "claude-sonnet-4-20250514"
    max_tokens: 8192
    temperature: 0.3
    top_p: 0.95
    timeout: 120
    # base_url: "https://api.anthropic.com"  # default

  moonshot:  # Kimi AI
    # api_key loaded from .env: TURBOQUANT_CLOUD_MOONSHOT_API_KEY
    model: "moonshot-v1-128k"
    max_tokens: 8192
    temperature: 0.3
    top_p: 0.95
    timeout: 120
    # base_url: "https://api.moonshot.cn/v1"  # default

  zhipu:  # GLM / ChatGLM (reasoning model)
    # api_key loaded from .env: TURBOQUANT_CLOUD_ZHIPU_API_KEY
    model: "glm-5.1"
    max_tokens: 16384
    temperature: 0.3
    top_p: 0.95
    timeout: 120
    # base_url: "https://open.bigmodel.cn/api/paas/v4"  # default
    # Alternative: base_url: "https://api.z.ai/api/paas/v4"
    #
    # Available models:
    # Text:   glm-5.1, glm-4.5-flash, glm-4-plus
    # Vision: glm-5v-turbo, glm-4.6v, glm-4.6v-flash, glm-4.6v-flashx, glm-4.5v
    # Agent:  autoglm-phone-multilingual

  deepseek:
    # api_key loaded from .env: TURBOQUANT_CLOUD_DEEPSEEK_API_KEY
    model: "deepseek-chat"
    max_tokens: 8192
    temperature: 0.3
    top_p: 0.95
    timeout: 120
    # base_url: "https://api.deepseek.com/v1"  # default

  groq:
    # api_key loaded from .env: TURBOQUANT_CLOUD_GROQ_API_KEY
    model: "llama-3.3-70b-versatile"
    max_tokens: 8192
    temperature: 0.3
    top_p: 0.95
    timeout: 60
    # base_url: "https://api.groq.com/openai/v1"  # default

  # custom:
  #   api_key loaded from .env: TURBOQUANT_CLOUD_CUSTOM_API_KEY
  #   base_url: "https://your-endpoint.com/v1"
  #   model: "your-model"
  #   max_tokens: 4096
  #   extra_headers:
  #     X-Custom-Header: "value"
