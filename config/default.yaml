# TurboQuant-X Server Configuration

model:
  name: "qwen3.5-35b-a3b"
  path: "./models/Qwen3.5-35B-A3B-q4_k_m.gguf"
  n_ctx: 4096
  n_gpu_layers: -1       # -1 = auto: optimal layers computed from VRAM at startup
  gpu_safety_margin: 0.92  # VRAM fraction to use for model layers (0.85-0.95 range)
                            # Higher = more GPU layers, slightly higher OOM risk
  chat_format: "chatml"
  n_threads: -1          # -1 = auto (cpu_count // 2 = 14 on i7-14700KF)
                          # For LLaMA-2-70B: set to 20 (all physical cores)
  n_threads_batch: -1    # -1 = auto (cpu_count = 28) for fast prompt eval
  n_batch: 512           # Prompt eval batch size. For 70B: use 1024

# Inference mode: "standard" | "turboquant" | "zero-quant"
#   standard   — llama.cpp Q8_0 KV cache, no Python overhead, KV grows each turn
#   turboquant — Q8_0 KV at C level + PolarQuant Python compression between turns
#                benchmark: 55.4 tok/s, CosSim=0.9953, Top-1=98.5%%, -25%% KV vs std
#   zero-quant — Q8_0 KV at C level + depth-adaptive PolarQuant (shallow/mid/deep)
#                benchmark: 55.5 tok/s, CosSim=0.9894, Top-1=93.6%%, -28%% KV vs std
inference_mode: "turboquant"

kv_cache:
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  flash_attention: true

# TurboQuant compression settings (only used when inference_mode = "turboquant")
# Presets: "quality" (K8/V4), "aggressive" (K8/V2), "symmetric" (K4/V4)
# Set preset OR individual k_bits/v_bits. Explicit values override the preset.
turboquant:
  preset: "quality"
  # k_bits: 8
  # v_bits: 4
  block_size: 128

# Zero-Quant depth-adaptive compression (only used when inference_mode = "zero-quant")
# Layers are grouped into three zones by depth; each zone uses independent K/V bits.
# Based on: arXiv:2405.17799 (activation sparsity), 2406.05955 (TurboSparse),
#           2511.06174 (co-quantization), 2601.05047 (memory bottleneck).
zero_quant:
  shallow_fraction: 0.25   # first 25%% of layers — dense activations, protect
  deep_fraction: 0.25      # last 25%% of layers — output-critical, protect
  shallow_k_bits: 8        # high precision for dense-activation shallow zone
  shallow_v_bits: 8
  middle_k_bits: 4         # aggressive compression for sparse middle zone
  middle_v_bits: 3         # raised from 2→3 for better Top-1 match (+0.25 bits)
  deep_k_bits: 8           # high precision for output-critical deep zone
  deep_v_bits: 8
  block_size: 128
  use_kv_coquant: false    # joint K-V codebook (paper 3); false = standard

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
    - "http://172.20.10.10:8000"

logging:
  level: "INFO"
