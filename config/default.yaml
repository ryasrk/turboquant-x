# TurboQuant Chat Server Configuration

model:
  name: "qwen2.5-7b-instruct"
  path: "./models/qwen2.5-7b-instruct-q4_k_m.gguf"
  n_ctx: 8192
  n_gpu_layers: -1
  chat_format: "chatml"

kv_cache:
  cache_type_k: "q8_0"
  cache_type_v: "turbo4"
  flash_attention: true

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"

logging:
  level: "INFO"
