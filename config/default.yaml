# TurboQuant-X Server Configuration

model:
  name: "qwen3.5-35b-a3b"
  path: "./models/Qwen3.5-35B-A3B-q4_k_m.gguf"
  n_ctx: 4096
  n_gpu_layers: -1   # -1 = auto: optimal layers computed from VRAM at startup
  chat_format: "chatml"
  n_threads: -1      # -1 = auto (cpu_count // 2). For 70B on CPU: set to 14-20
  n_batch: 512       # Prompt eval batch size. For 70B: use 1024 for faster prompt processing

# Inference mode: "standard" or "turboquant"
#   standard   — llama.cpp with Q8_0 KV cache (no Python-level compression)
#   turboquant — llama.cpp with Q8_0 KV cache + TurboQuant
#                compression/decompression between turns
inference_mode: "turboquant"

kv_cache:
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  flash_attention: true

# TurboQuant compression settings (only used when inference_mode = "turboquant")
# Presets: "quality" (K8/V4), "aggressive" (K8/V2), "symmetric" (K4/V4)
# Set preset OR individual k_bits/v_bits. Explicit values override the preset.
turboquant:
  preset: "quality"
  # k_bits: 8
  # v_bits: 4
  block_size: 128

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
    - "http://172.20.10.10:8000"

logging:
  level: "INFO"
