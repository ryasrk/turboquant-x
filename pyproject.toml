[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-x"
version = "0.1.0"
description = "TurboQuant-powered LLM inference with KV cache compression"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "sse-starlette>=2.0",
    "aiofiles>=23.0",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "ddgs>=9.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
gpu = [
    "llama-cpp-python>=0.3",
    "pynvml>=12.0",
    "huggingface-hub>=0.21",
]
bench = [
    "datasets>=2.18",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tabulate>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
